name: release

# Pushing a tag vX.Y.Z publishes swarmbox-sdk (the client, with the Harbor
# provider as its `harbor` extra) to PyPI at that version. It goes through
# PyPI trusted publishing: PyPI trusts the publish job in the environment
# pypi-swarmbox-sdk, so no token is stored anywhere. A version can never be
# reused on PyPI, so nothing is built unless the tag matches the package's
# version.
on:
  push:
    tags: ["v*"]

jobs:
  # Builds with uv. Holds no publishing credentials.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Tag matches the version
        run: dev/check-release.sh "${GITHUB_REF_NAME#v}"
      - name: Build
        run: uvx --from rust-just just dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Only this job can mint the OIDC token PyPI accepts.
  publish-swarmbox-sdk:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-swarmbox-sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          # Re-running a release that failed halfway uploads only what's
          # missing; the builds are reproducible, so nothing differs.
          skip-existing: true

