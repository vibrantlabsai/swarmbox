[project]
name = "opendsec"
version = "0.4.0"
description = "Renamed to swarmbox-sdk. This package installs it and keeps `import opendsec` working."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vibrant Labs" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 7 - Inactive",
    "Programming Language :: Python :: 3",
]
dependencies = [
    # Released together with the package it forwards to.
    "swarmbox-sdk>=0.4,<0.5",
]

[project.urls]
Documentation = "https://swarmbox.vibrantlabs.com"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
swarmbox-sdk = { path = "../..", editable = true }
