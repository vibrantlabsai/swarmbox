{{- $desc := .Description | default site.Params.description -}}
{{- $title := cond .IsHome (printf "%s: %s" site.Title .Title) (printf "%s | %s" .Title site.Title) -}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{ $title }}</title>
<meta name="description" content="{{ $desc }}">
{{- if site.Params.noindex }}
<meta name="robots" content="noindex, nofollow">
{{- end }}
<link rel="canonical" href="{{ .Permalink }}">
<meta property="og:site_name" content="{{ site.Title }}">
<meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
<meta property="og:title" content="{{ $title }}">
<meta property="og:description" content="{{ $desc }}">
<meta property="og:url" content="{{ .Permalink }}">
{{- with site.Params.shareImage }}
<meta property="og:image" content="{{ . | absURL }}">
<meta name="twitter:card" content="summary_large_image">
{{- else }}
<meta name="twitter:card" content="summary">
{{- end }}
<link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
<script>(function(){try{var t=localStorage.getItem('sb-theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
