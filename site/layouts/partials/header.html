{{- $api := eq .Params.group "API reference" -}}
{{- $docs := and (eq .Section "docs") (not $api) -}}
<header class="hdr">
<a class="brand" href="{{ "/" | relURL }}">{{ partial "logo.html" . }}<span>{{ site.Title }}</span><span class="pill">Beta</span></a>
<nav class="nav" aria-label="Main">
<a{{ if $docs }} class="on"{{ end }} href="{{ "docs/" | relURL }}">Docs</a>
<a{{ if $api }} class="on"{{ end }} href="{{ with site.GetPage "/docs/http-api" }}{{ .RelPermalink }}{{ end }}">API reference</a>
<a href="{{ site.Params.github }}" target="_blank" rel="noopener">GitHub</a>
</nav>
<div class="acts">
<a class="btn sm" href="#waitlist"><span class="w-long">Join the waitlist</span><span class="w-short">Waitlist</span></a>
<button class="icon-btn" type="button" data-theme-toggle aria-label="Switch theme"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="1.5"></circle><path d="M9 2a7 7 0 0 1 0 14z" fill="currentColor"></path></svg></button>
</div>
</header>
